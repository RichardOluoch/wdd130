<!doctype html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML and CSS Quiz | WDD 130</title>
    <meta name="description" content="Quiz Form">
    <meta name="author" content="Richard Oluoch">
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <form>
            <h1>Basic HTML and CSS Quiz</h1>
            <fieldset>
                <div>
                    <label for="acronym">1. What does the acronym CSS stand for?</label>
                    <input type="text" id="q1" name="q1">
                </div>

                <div>
                    <label for="selected">2. How are id and class attributes selected in
                        CSS?</label>
                    <!-- <input type="text" id="selected" name="selected"> -->
                    <textarea id="q2" name="q2" rows="8" cols="70"></textarea>
                </div>

                <div>
                    <label for="comment">3. Which of the following is a valid CSS comment?</label>
                    <select>
                        <option value="" selected disabled>Choose One ...</option>
                        <option value="single-line">/* Single-line comment explaining the rule below
                            */
                        </option>
                        <option value="multi-line">/*
                            Multi-line comment:
                            We are using a grid here to ensure
                            the sidebar behaves on mobile.
                            */</option>
                        <option value="header">/* =====
                            SECTION HEADER: Main Layout Styles
                            ===== */</option>
                        <option value="commenting">/* Commenting out an entire block of code to
                            disable
                            it:
                            .old-button {
                            background-color: blue;
                            }
                            */</option>
                    </select>
                    <!-- <input type="text" id="q3" name="q3"> -->
                </div>

                <div>
                    <label for="comment">4. What is the bottom margin given this
                        declaration?</label>
                    <input type="text" id="q4" name="q4">
                    <p>margin: 10px 5px 15px;</p>
                </div>

                <div>
                    <button type="submit">Submit Quiz</button>
                </div>
            </fieldset>
        </form>
    </main>
</body>
<footer></footer>

</html>
