<!DOCTYPE html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms | WDD 130</title>
    <meta name="description" content="Building a form using basic form elements">
    <meta name="author" content="Richard Oluoch">
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<header></header>
<main>
    <form>
        <h1>WDD 130 | HTML Form - User Poll</h1>
        <fieldset>
            <legend>Contact Information</legend>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email Address:</label>
            <input type="email" id="useremail" name="useremail" required>
        </fieldset>

        <fieldset>
            <legend>Questions</legend>
            <label for="browser">What is your favorite browser?</label>
            <select name="browser" id="browser">
                <option value="chrome">Chrome</option>
                <option value="firefox">Firefox</option>
                <option value="edge">Microsoft Edge</option>
            </select>

            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">
            <label for="feedback">List the places you have lived:</label>
            <textarea id="feedback" name="feedback" rows="4"
              placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
        </fieldset>

        <button type="submit">Submit Poll</button>
    </form>
</main>
<footer>©️2026 | HTML Form - User Poll Activity | Richard Oluoch</footer>

</html>
